        body {

            background-attachment: fixed; /* Keeps the background fixed */

            font-family: 'Inter', sans-serif;
            /* Use flexbox to center all content vertically and horizontally */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow: hidden; /* Prevent scrollbars if content is too large */
        }

        /* This is the container for the canvas and the center spin button */
        #spin_the_wheel {
            display: inline-block;
            position: relative; /* Allows absolute positioning for children */
            overflow: hidden; /* Clips any overflow */
            /* Added margin-top to push wheel down slightly from the background text */
            margin-top: 5rem; 
        }

        /* The canvas element where the wheel is drawn */
        #wheel {
            display: block; /* Removes any extra space below the canvas */
            border-radius: 50%;
            /* Adds the heavy border and shadow for a 3D look */
            border: 15px solid #FFFFFF; /* Changed to White border for Christmas theme */
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 0, 0, 0.6);
            /* The rotation is controlled by JavaScript via 'transform' */
            transform: rotate(0rad); 
        }

        /* The center "spin" button */
        #spin {
            /* CHANGED: Updated font to Avant Garde Demi */
            font-family: 'Avant Garde Demi', sans-serif; 
            font-size: 1.4rem;
            line-height: 0;
            user-select: none; /* Prevents text selection on click */
            cursor: pointer;
            display: flex; /* Centers the text inside */
            justify-content: center;
            align-items: center;
            position: absolute; /* Positions it on top of the canvas */
            /* This is the trick to center it: 50% from top/left... */
            top: 50%;
            left: 50%;
            width: 25%; /* 25% of the canvas size */
            height: 25%;
            /* ...then pull it back by half its own width/height */
            margin: -12.5%; 
            background: #fff;
            color: #333; /* Dark text on white button */
            box-shadow:
                0 0 0 8px currentColor, /* Creates the colored border */
                0 0px 15px 5px rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            transition: 0.8s; /* Smooth color/text change */
            z-index: 10; /* Ensures it's above the canvas */
        }

        /* The triangular pointer, attached to the #spin button */
        /* '::after' is a CSS pseudo-element */
        #spin::after {
            content: "";
            position: absolute;
            /* Positioned at the bottom of the #spin button */
            bottom: -17px; 
            /* This is the "CSS triangle trick" */
            border: 10px solid transparent;
            border-top-color: currentColor; /* The triangle color matches the button's shadow */
            border-bottom: none;
        }

            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            z-index: 1000; /* Highest z-index to be on top of everything */
            position: fixed; /* Stays in place even if screen scrolls */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Center it perfectly */
            display: none; /* Hidden by default */
            min-width: 300px;
        }

        /* The dark overlay behind the pop-up */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

            background: rgba(0, 0, 0, 0.7); /* Darkens the background */
            z-index: 998; /* Below the sparkles, which is below the pop-up */

                // If the label is "unlucky", use the dedicated green color
                sectorColor = UNLUCKY_GREEN;
            } else {
                // For prize slices, alternate between RED and GOLD
                sectorColor = alternatingColors[alternatingIndex % alternatingColors.length];
                alternatingIndex++;
            }
            
            return {
                color: sectorColor, 
                text: "#FFFFFF", // White text
                label: label
            };
        });

        // --- 2. EVENT SYSTEM ---
        const events = {
            listeners: {},
            addListener: function (eventName, fn) {
                this.listeners[eventName] = this.listeners[eventName] || [];
                this.listeners[eventName].push(fn);
            },
            fire: function (eventName, ...args) {
                if (this.listeners[eventName]) {
                    for (let fn of this.listeners[eventName]) {
                        fn(...args); 
                    }
                }
            },
        };

        // --- 3. WHEEL SETUP & CONSTANTS ---
        const rand = (m, M) => Math.random() * (M - m) + m; 
        const tot = sectors.length; 
        const spinEl = document.querySelector("#spin"); 
        const wheelEl = document.querySelector("#wheel"); 
        const ctx = wheelEl.getContext("2d"); 
        const dia = ctx.canvas.width; // Reads the diameter (800)
        const rad = dia / 2; // Sets the radius (400)
        const PI = Math.PI; 
        const TAU = 2 * PI; 
        const arc = TAU / sectors.length; 

        // --- 4. CORE SPIN LOGIC ---
        // Pointer is at 6 o'clock (PI/2 radians)
        const pointerAngle = PI / 2; 
        
        // Map rotation to index
        const getIndex = () => Math.floor(((pointerAngle - ang + TAU) % TAU) / arc);

        const friction = 0.991; 
        let angVel = 0; 
        let ang = 0; 

        let spinButtonClicked = false; 

        // --- 5. CANVAS DRAWING ---
        function drawSector(sector, i) {
            const ang = arc * i; 
            ctx.save(); 

            // 1. DRAW THE COLORED SLICE
            ctx.beginPath();
            ctx.fillStyle = sector.color;
            ctx.moveTo(rad, rad); 
            ctx.arc(rad, rad, rad, ang, ang + arc); 
            ctx.lineTo(rad, rad); 
            ctx.fill(); 

            // 2. DRAW THE TEXT
            ctx.translate(rad, rad); 
            ctx.rotate(ang + arc / 2); 
            ctx.textAlign = "right"; 
            ctx.fillStyle = sector.text;
            
            // --- FONT CHANGE HERE ---
            // Using the custom 'Avant Garde Demi' font family defined in the <style> block
            ctx.font = "bold 28px 'Avant Garde Demi', sans-serif"; 
            
            // Add a strong shadow to make text pop against gold/red
            ctx.shadowColor = "rgba(0,0,0,0.8)";
            ctx.shadowBlur = 4;
            ctx.fillText(sector.label, rad - 10, 10); 

            ctx.restore(); 
        }

        function rotate() {
            const sector = sectors[getIndex()];
            
            wheelEl.style.transform = `rotate(${ang}rad)`;

            spinEl.textContent = !angVel ? "spin" : sector.label;
            spinEl.style.background = angVel ? sector.color : "#FFFFFF"; 
            // Ensure text is readable on button
            spinEl.style.color = angVel ? "#FFFFFF" : "#333333"; 
            // Add text shadow to button text if spinning
            if (angVel) {
                 spinEl.style.textShadow = "1px 1px 2px black";
            } else {
                 spinEl.style.textShadow = "none";
            }
        }

        // --- 6. THE GAME LOOP ---
        function frame() {
            if (spinButtonClicked && angVel === 0) {
                angVel = rand(0.15, 0.25); 
                spinButtonClicked = false; 
            }

            if (angVel > 0) {
                angVel *= friction; 
                
                if (angVel < 0.002) {
                    angVel = 0; 
                    const finalSector = sectors[getIndex()]; 
                    events.fire("spinEnd", finalSector); 
                }

                ang += angVel; 
                ang %= TAU; 
                rotate(); 
            }

            requestAnimationFrame(frame);
        }
        
        // --- 7. SPARKLE EFFECT LOGIC ---
        const sparkleCanvasEl = document.getElementById('sparkleCanvas');
        const sparkleCtx = sparkleCanvasEl.getContext('2d');
        // Defined colors: Gold, Green, Red, White
        const sparkleColors = ['#eab308', '#10b981', '#dc2626', '#FFFFFF']; 
        let particles = [];
        let sparkleAnimationFrameId = null;

        function resizeSparkleCanvas() {
            sparkleCanvasEl.width = window.innerWidth;
            sparkleCanvasEl.height = window.innerHeight;
        }

	//<!--Produced by Build-KakaShi -->
        // Sparkle Particle Class
        class Sparkle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = rand(1, 4);
                this.color = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
                this.velocity = {
                    x: rand(-1.5, 1.5),
                    y: rand(-1.5, 1.5)
                };
                this.life = rand(30, 60); // Frames until particle dies
            }

            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.velocity.y += 0.05; // Simple gravity effect
                this.life--;
                this.size *= 0.98; // Shrink effect
            }

            draw() {
                sparkleCtx.beginPath();
                sparkleCtx.arc(this.x, this.y, this.size, 0, TAU);
                sparkleCtx.fillStyle = this.color;
                // Add blur/shadow for the glow effect
                sparkleCtx.shadowColor = this.color;
                sparkleCtx.shadowBlur = 8;
                sparkleCtx.fill();
            }
        }

        /**
         * Creates a specified number of sparkles randomly across the entire screen.
         * @param {number} count The number of particles to create.
         */
        function createSparkles(count) {
            const w = sparkleCanvasEl.width;
            const h = sparkleCanvasEl.height;

            for (let i = 0; i < count; i++) {
                // Random position within the entire canvas bounds (full screen)
                const x = rand(0, w);
                const y = rand(0, h);
                particles.push(new Sparkle(x, y));
            }
        }


        // Animation loop for sparkles
        function sparkleLoop() {
            // Clear the canvas, but keep a slight residue for a smooth trail effect
            sparkleCtx.clearRect(0, 0, sparkleCanvasEl.width, sparkleCanvasEl.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.update();
                particle.draw();

                if (particle.life <= 0 || particle.size < 0.5) {
                    particles.splice(i, 1);
                }
            }

            // Continuously add new particles if the popup is visible
            if (winPopup.style.display === 'block') {
                createSparkles(12); // Create 12 new particles per frame for a full screen effect
            } else {
                // If the popup is hidden and all particles are gone, stop the loop
                if (particles.length === 0) {
                    stopSparkles();
                }
            }

            sparkleAnimationFrameId = requestAnimationFrame(sparkleLoop);
        }

        function startSparkles() {
            resizeSparkleCanvas();
            sparkleCanvasEl.style.display = 'block';
            if (!sparkleAnimationFrameId) {
                sparkleLoop();
            }
        }

        function stopSparkles() {
            // Only stop the animation loop if it's currently running
            if (sparkleAnimationFrameId) {
                cancelAnimationFrame(sparkleAnimationFrameId);
                sparkleAnimationFrameId = null;
            }
            // Wait for all particles to fade before hiding the canvas (sparkleLoop handles this fade-out)
            if (particles.length === 0) {
                 sparkleCanvasEl.style.display = 'none';
            }
        }
        
        window.addEventListener('resize', resizeSparkleCanvas);

	//<!--Produced by Build-KakaShi -->
	// Some efforts come from https://github.com/olimorris/spin-the-wheel/tree/main


        // --- 8. INITIALIZATION & POP-UP LOGIC ---
        
        // Element references
        const winPopup = document.getElementById('winPopup');
        const popupOverlay = document.getElementById('popupOverlay');
        const popupTitle = document.getElementById('popupTitle'); // New reference for H2 title
        const popupMessage = document.getElementById('popupMessage'); // New reference for P message

        events.addListener("spinEnd", (sector) => {
            const prize = sector.label;
            
            // LOGIC TO CUSTOMIZE POPUP FOR "Unlucky"
            if (prize === "unlucky") {
                // Set custom title and message for "unlucky"
                popupTitle.textContent = "better luck next time 🎄";
                popupMessage.textContent = "you did not win a prize this time, but you're still on santa's list!";
            } else {
                // Set standard title and message for a winning prize
                popupTitle.textContent = "congratulations 🎁";
                // Use innerHTML to inject the strong tag for the prize name
                popupMessage.innerHTML = `you've won a <strong class="text-white underline">${prize}</strong> gift!`;
            }
            
            // Display popup and start sparkles
            winPopup.style.display = 'block';
            popupOverlay.style.display = 'block';
            startSparkles(); // Start the sparkle animation across the full screen!
            
            spinEl.textContent = "spin";
            spinEl.style.background = "#FFFFFF";
            spinEl.style.color = "#333333";
            spinEl.style.textShadow = "none";
        });

        function closePopup() {
            // Hide popup and start the sparkle fade-out
            winPopup.style.display = 'none';
            popupOverlay.style.display = 'none';
            // Note: stopSparkles is now called indirectly by sparkleLoop once all particles fade out
        }

        function init() {
            // Wait for the font to be ready before drawing
            document.fonts.ready.then(() => {
                sectors.forEach(drawSector);
                rotate(); 
                // Initial sparkle canvas size setup
                resizeSparkleCanvas(); 
                requestAnimationFrame(frame); 
            });

            spinEl.addEventListener("click", () => {
                if (angVel === 0) { 
                    spinButtonClicked = true; 
                }
            });
        }

        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
